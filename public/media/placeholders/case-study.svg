<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Abstract campaign composition</title>
  <desc id="desc">An editorial arrangement of campaign frames and tonal fields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece7dd"/>
      <stop offset=".45" stop-color="#c8cdd2"/>
      <stop offset="1" stop-color="#242830"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect x="120" y="150" width="610" height="760" rx="34" fill="#0b0d10" fill-opacity=".22"/>
  <rect x="830" y="230" width="520" height="260" rx="28" fill="#fbfaf7" fill-opacity=".18"/>
  <rect x="830" y="550" width="380" height="260" rx="28" fill="#fbfaf7" fill-opacity=".12"/>
  <circle cx="440" cy="530" r="150" fill="#d8c7a2" fill-opacity=".26"/>
</svg>
