name: Production readiness

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_PROFILE: production
      LEGAL_ENTITY_MODE: ${{ vars.LEGAL_ENTITY_MODE }}
      PUBLIC_WORK_MODE: ${{ vars.PUBLIC_WORK_MODE }}
      PUBLIC_MARKET_ENTRY_MODE: ${{ vars.PUBLIC_MARKET_ENTRY_MODE }}
      LEGAL_REVIEW_CONFIRMED: ${{ vars.LEGAL_REVIEW_CONFIRMED }}
      PUBLIC_COMPANY_DETAILS_CONFIRMED: ${{ vars.PUBLIC_COMPANY_DETAILS_CONFIRMED }}
      APPROVED_MEDIA_CONFIRMED: ${{ vars.APPROVED_MEDIA_CONFIRMED }}
      PUBLIC_CASE_EVIDENCE_CONFIRMED: ${{ vars.PUBLIC_CASE_EVIDENCE_CONFIRMED }}
      CONTACT_CHANNELS_CONFIRMED: ${{ vars.CONTACT_CHANNELS_CONFIRMED }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${{ vars.NEXT_PUBLIC_LEGAL_COMPANY_NAME }}
      NEXT_PUBLIC_PRIVACY_CONTROLLER_NAME: ${{ vars.NEXT_PUBLIC_PRIVACY_CONTROLLER_NAME }}
      NEXT_PUBLIC_COMPANY_NUMBER: ${{ vars.NEXT_PUBLIC_COMPANY_NUMBER }}
      NEXT_PUBLIC_REGISTERED_OFFICE: ${{ vars.NEXT_PUBLIC_REGISTERED_OFFICE }}
      NEXT_PUBLIC_BUSINESS_EMAIL: ${{ vars.NEXT_PUBLIC_BUSINESS_EMAIL }}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${{ vars.NEXT_PUBLIC_PRIVACY_EMAIL }}
      NEXT_PUBLIC_LEGAL_APPROVAL_STATUS: ${{ vars.NEXT_PUBLIC_LEGAL_APPROVAL_STATUS }}
      NEXT_PUBLIC_TERMS_APPROVAL_STATUS: ${{ vars.NEXT_PUBLIC_TERMS_APPROVAL_STATUS }}
      NEXT_PUBLIC_PRIVACY_EFFECTIVE_DATE: ${{ vars.NEXT_PUBLIC_PRIVACY_EFFECTIVE_DATE }}
      NEXT_PUBLIC_TERMS_EFFECTIVE_DATE: ${{ vars.NEXT_PUBLIC_TERMS_EFFECTIVE_DATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      - run: npm run validate:release:production
